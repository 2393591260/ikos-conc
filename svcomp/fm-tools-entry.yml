id: ikos-conc
name: IKOS-ConC
description: |
  IKOS-ConC analyzes data races in concurrent C programs using abstract
  interpretation on the NASA IKOS framework. It combines thread-modular
  interprocedural analysis with lockset and happens-before reasoning.
  In its competition configuration, abstract race reports are demoted to
  UNKNOWN and candidates are checked using a bounded SMT encoding with Z3.
  Unsupported or inconclusive candidates remain UNKNOWN. For reported data
  races, the tool emits YAML violation witnesses in SV-Witnesses format 2.2.
input_languages:
