# FM-Tools entry for IKOS-ConC (SV-COMP 2027).
#
# Submit this file (as `ikos-conc.yml`) to
#   https://gitlab.com/sosy-lab/benchmarking/fm-tools  under `data/`.
#
# Placeholders to fill before submitting:
#   * <orcid> / <name> / <institution> / <country> / <url> — the jury member
#     (in competition_participations[].jury_member) and participants.
#   * <version> — keep "svcomp27" unless the org name changes.
#   * <doi-ikos-paper> — the IKOS concept-paper DOI for literature[].
# Zenodo DOI (versions[].doi) is filled: 10.5281/zenodo.23122650.

id: ikos-conc
name: IKOS-ConC
description: |
  IKOS-ConC is a sound static analyzer for detecting data races in
  concurrent C programs, built on the NASA IKOS framework. It performs a
  thread-modular interprocedural analysis with a must-lockset / happens-before
  check, then demotes every abstract race to UNKNOWN and re-confirms the
  provable ones with a bounded model checker (SMT happens-before/alias
  encoding). This is sound in both directions: no missed race (FN=0) and no
  false positive (FP=0); a race is only claimed when the bounded checker
  proves it.
input_languages:
  - C
project_url: https://github.com/2393591260/ikos-conc
repository_url: https://github.com/2393591260/ikos-conc
spdx_license_identifier: NASA-1.3
benchexec_toolinfo_module: benchexec.tools.ikos-conc
fmtools_format_version: "2.0"
fmtools_entry_maintainers:
  - <gitlab-username>

maintainers:
  - orcid: <orcid>
    name: <name>
    institution: <institution>
    country: <country>
    url:

versions:
  - version: "svcomp27"
    doi: 10.5281/zenodo.23122650
    benchexec_toolinfo_options: []
    required_ubuntu_packages:
      - libc6-dev
      - libc6-dev-i386
      - lib32gcc-13-dev
      - libgmp10
      - libgmpxx4ldbl
      - libmpfr6
      - libppl14
      - libboost-filesystem1.83.0
      - libboost-thread1.83.0
      - libtbb12
      - libsqlite3-0
      - libtinfo6
      - libz1
      - libz3-4
      - libicu74
      - libxml2
      - libffi8
      - libedit2
      - libbsd0
      - liblzma5
      - libmd0
      - python3
    base_container_images:
      - docker.io/ubuntu:24.04
    full_container_images:
      - <auto-generated-after-zenodo-upload>

competition_participations:
  - competition: "SV-COMP 2027"
    track: "Verification"
    tool_version: "svcomp27"
    jury_member:
      orcid: <orcid>
      name: <name>
      institution: <institution>
      country: <country>
      url:
    participants:
