name: Quick checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check documentation, runtime, runner and packaging contracts
        run: |
          python3 scripts/check_concurrency_docs.py
          python3 scripts/test_ikos_runtime.py
          python3 scripts/test_svcomp_race_runner.py
          python3 scripts/test_svcomp_package.py
