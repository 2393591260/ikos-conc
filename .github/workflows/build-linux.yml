name: Build tool on Linux
on:
  push:
  pull_request:
jobs:
  build-linux:
    runs-on: ubuntu-24.04

    env:
     MAKEFLAGS: -j2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
         sudo apt-get update
         sudo apt-get install --yes \
           gcc g++ cmake libgmp-dev libboost-dev libboost-filesystem-dev \
           libboost-thread-dev libboost-test-dev \
           libsqlite3-dev libtbb-dev libz-dev libedit-dev \
           python3 python3-pip python3-venv libz3-dev \
           llvm-14 llvm-14-dev llvm-14-tools clang-14 \
           libc6-dev-i386 lib32gcc-13-dev
      - name: Check benchmark harness
        run: |
          python3 scripts/test_ikos_runtime.py
          python3 scripts/test_svcomp_race_runner.py
      - name: Compile IKOS
        run: |
          mkdir build
          cd build
          cmake \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" \
            -DCMAKE_BUILD_TYPE="Release" \
            -DLLVM_CONFIG_EXECUTABLE="/usr/lib/llvm-14/bin/llvm-config" \
            ..
          make
          make install
          "$GITHUB_WORKSPACE/install/libexec/bin/python" -m pip install benchexec
      - name: Add IKOS to the path
        run: |
          echo "$GITHUB_WORKSPACE/install/bin" >> $GITHUB_PATH
      - name: Confirm that it runs
        run: |
          ikos --version
      - name: Check partitioned-domain inclusion
        run: |
          cmake --build build --target test-core-domain-memory-partitioning
          ctest --test-dir build -R '^core-domain-memory-partitioning$' --output-on-failure
      - name: Check concurrent analysis and evidence
        run: ctest --test-dir build -L concurrency --output-on-failure
